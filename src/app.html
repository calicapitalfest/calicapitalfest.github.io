<!doctype html>
<!--
	The copy mixes Spanish with English event names (Battle of Giants, Line Up, Workshops...),
	so browsers' auto-translate keeps "translating" the English bits or mangling names.
	lang="es" is the main language; translate="no" plus the notranslate meta opt out of
	Chrome / Google Translate / Edge prompts.
-->
<html lang="es" translate="no">

<head>
	<meta charset="utf-8" />
	<meta name="google" content="notranslate" />
	<meta http-equiv="Content-Language" content="es" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<link rel="icon" href="%sveltekit.assets%/favicon-2026.ico" sizes="any" />
	<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-2026.png" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-2026.png" />

	<!-- Fonts used above the fold, fetched in parallel with the CSS instead of after it -->
	<link rel="preload" href="%sveltekit.assets%/fonts/polymath-super.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="preload" href="%sveltekit.assets%/fonts/guttery.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="preload" href="%sveltekit.assets%/fonts/dmsans-medium.woff2" as="font" type="font/woff2" crossorigin />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-slate-950 text-white relative">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
